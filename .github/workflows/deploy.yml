name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy LUMECORE

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install npm dependencies
        run: npm install --legacy-peer-deps

      - name: Build assets
        env: # This "injects" the secrets so Vite can "bake" them into the JS
          VITE_REVERB_APP_KEY: ${{ secrets.VITE_REVERB_APP_KEY }}
          VITE_REVERB_HOST: ${{ secrets.VITE_REVERB_HOST }}
          VITE_REVERB_PORT: ${{ secrets.VITE_REVERB_PORT }}
          VITE_REVERB_SCHEME: ${{ secrets.VITE_REVERB_SCHEME }}
          VITE_APP_NAME: "LumeCore"
        run: npm run build

      # Fix permissions before uploading built assets
      - name: Prepare server directories for upload
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.AZURE_SSH_HOST }}
          username: ${{ secrets.AZURE_SSH_USERNAME }}
          key: ${{ secrets.AZURE_SSH_KEY }}
          port: ${{ secrets.AZURE_SSH_PORT }}
          script: |
            # Ensure target directories exist and azureuser can write to them
            sudo mkdir -p /var/www/lumecore/public/build
            sudo mkdir -p /var/www/lumecore/bootstrap/ssr
            # Remove old build artifacts to avoid stale files
            sudo rm -rf /var/www/lumecore/public/build/*
            sudo rm -rf /var/www/lumecore/bootstrap/ssr/*
            # Grant azureuser ownership so SCP can write
            sudo chown -R azureuser:azureuser /var/www/lumecore/public/build
            sudo chown -R azureuser:azureuser /var/www/lumecore/bootstrap/ssr

      # Upload built assets to the server (so we don't build on the low-RAM VM)
      - name: Deploy built assets to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.AZURE_SSH_HOST }}
          username: ${{ secrets.AZURE_SSH_USERNAME }}
          key: ${{ secrets.AZURE_SSH_KEY }}
          port: ${{ secrets.AZURE_SSH_PORT }}
          source: "public/build/*"
          target: "/var/www/lumecore"
          overwrite: true

      # Upload SSR build if it exists
      - name: Deploy SSR assets to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.AZURE_SSH_HOST }}
          username: ${{ secrets.AZURE_SSH_USERNAME }}
          key: ${{ secrets.AZURE_SSH_KEY }}
          port: ${{ secrets.AZURE_SSH_PORT }}
          source: "bootstrap/ssr/*"
          target: "/var/www/lumecore"
          overwrite: true

      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        env:
          GITHUB_TOKEN: "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"
        with:
          host: ${{ secrets.AZURE_SSH_HOST }}
          username: ${{ secrets.AZURE_SSH_USERNAME }}
          key: ${{ secrets.AZURE_SSH_KEY }}
          port: ${{ secrets.AZURE_SSH_PORT }}
          command_timeout: 30m
          envs: GITHUB_TOKEN
          script: |
            cd /var/www/lumecore

            # Prevent git from asking for credentials (prevents hanging)
            export GIT_TERMINAL_PROMPT=0

            # Check if token is present
            if [ -z "$GITHUB_TOKEN" ]; then
              echo "ERROR: GITHUB_TOKEN is empty. Please ensure secrets.GITHUB_TOKEN_PAT is set in repo secrets."
              exit 1
            fi

            # Set remote URL with token for private repo authentication
            # We use a masking check to avoid printing the token
            git remote set-url origin https://$GITHUB_TOKEN@github.com/EisenDev/LumeCore.git

            # Fetch and Reset (safer than pull for deployments)
            echo ">> Fetching latest changes..."
            git fetch origin main

            echo ">> Resetting to match origin/main..."
            git reset --hard origin/main

            # ============================================
            # Ensure production environment
            # ============================================
            # Fix APP_ENV if it's not production (this causes white pages)
            if grep -q "APP_ENV=local" .env 2>/dev/null; then
              sed -i 's/APP_ENV=local/APP_ENV=production/' .env
              echo ">> Fixed APP_ENV to production"
            fi
            if grep -q "APP_DEBUG=true" .env 2>/dev/null; then
              sed -i 's/APP_DEBUG=true/APP_DEBUG=false/' .env
              echo ">> Fixed APP_DEBUG to false"
            fi

            # Fix DB_PORT to 6543 if using Supabase Pooler (avoids connection refused)
            # Supabase Poolers (Transaction Mode) listen on 6543. 5432 is often refused or Session mode only.
            if grep -q "pooler.supabase.com" .env 2>/dev/null; then
               sed -i 's/DB_PORT=5432/DB_PORT=6543/' .env
               echo ">> Fixed DB_PORT to 6543 for Supabase Pooler"
            fi

            # Install PHP dependencies
            composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev

            # Clear stale config cache so migrations pick up the .env changes (like DB_PORT)
            php artisan config:clear

            # Run migrations
            php artisan migrate --force

            # Clear and rebuild caches
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan event:cache
            php artisan optimize

            # Fix storage & cache permissions
            sudo chown -R www-data:www-data storage bootstrap/cache
            sudo chmod -R 775 storage bootstrap/cache

            # Ensure built assets have correct ownership
            sudo chown -R www-data:www-data public/build bootstrap/ssr 2>/dev/null || true

            # Add azureuser to www-data group so future artisan calls work
            sudo usermod -aG www-data azureuser

            # ============================================
            # Setup Supervisor for queue workers & Reverb
            # ============================================
            # Install supervisor if not present
            if ! command -v supervisord &> /dev/null; then
              sudo apt-get update -qq && sudo apt-get install -y -qq supervisor
              sudo systemctl enable supervisor
              sudo systemctl start supervisor
              echo ">> Installed Supervisor"
            fi

            # Copy supervisor config (from repo) to system
            sudo cp /var/www/lumecore/deployment/supervisor/lumecore-worker.conf /etc/supervisor/conf.d/lumecore-worker.conf

            # Reload supervisor config and restart programs
            sudo supervisorctl reread
            sudo supervisorctl update
            sudo supervisorctl restart lumecore-queue-worker:*
            sudo supervisorctl restart lumecore-reverb:*

            echo ">> Queue workers and Reverb started via Supervisor"

            # Restart PHP-FPM to pick up changes
            sudo systemctl restart php8.4-fpm 2>/dev/null || sudo systemctl restart php8.3-fpm 2>/dev/null || true

            echo "============================================"
            echo "Deployment complete!"
            echo "============================================"
            echo "Services status:"
            sudo supervisorctl status
