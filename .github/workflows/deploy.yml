name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy LUMECORE

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install npm dependencies
        run: npm install --legacy-peer-deps

      - name: Build assets
        run: npm run build

      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.AZURE_SSH_HOST }}
          username: ${{ secrets.AZURE_SSH_USERNAME }}
          key: ${{ secrets.AZURE_SSH_KEY }}
          port: ${{ secrets.AZURE_SSH_PORT }}
          script: |
            cd /var/www/lumecore

            # Pull latest changes
            git pull origin main

            # Install PHP dependencies
            composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev

            # Install Node dependencies and build assets
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            npm install --legacy-peer-deps
            npm run build

            # Run migrations (before permission change so azureuser can write)
            php artisan migrate --force

            # Clear and rebuild caches (before permission change)
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan event:cache
            php artisan optimize

            # Fix storage & cache permissions AFTER artisan commands
            sudo chown -R www-data:www-data storage bootstrap/cache
            sudo chmod -R 775 storage bootstrap/cache

            # Add azureuser to www-data group so future artisan calls work
            sudo usermod -aG www-data azureuser

            # Restart queue workers if applicable
            php artisan queue:restart 2>/dev/null || true

            echo "Deployment complete!"
